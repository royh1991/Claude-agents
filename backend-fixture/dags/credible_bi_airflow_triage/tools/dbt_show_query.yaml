type: custom
name: dbt_show_query
description: |
  Run a bounded `dbt show --inline` query against the warehouse. SELECT/CTE
  only, single statement, 30 second timeout; secret env vars are stripped
  from the subprocess.
permission_policy:
  type: always_allow
input_schema:
  type: object
  additionalProperties: false
  required: [sql]
  properties:
    sql:
      type: string
      minLength: 1
    limit:
      type: integer
      minimum: 1
      maximum: 1000
