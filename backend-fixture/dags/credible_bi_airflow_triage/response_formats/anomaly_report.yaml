type: json_schema
name: anomaly_report
schema:
  type: object
  additionalProperties: false
  required:
    - title
    - summary
    - anomaly_detected
    - findings
    - query_proof
    - recommended_actions
    - severity
    - confidence
  properties:
    title:
      type: string
    summary:
      type: string
    anomaly_detected:
      type: boolean
    findings:
      type: array
      items:
        type: string
    query_proof:
      type: array
      items:
        type: string
    evidence:
      type: array
      items:
        type: string
    recommended_actions:
      type: array
      items:
        type: string
    severity:
      type: string
      enum: [low, medium, high]
    confidence:
      type: string
      enum: [low, medium, high]
