type: json_schema
name: failure_triage_report
schema:
  type: object
  additionalProperties: false
  required:
    - title
    - summary
    - root_cause_hypothesis
    - evidence
    - recommended_actions
    - severity
    - confidence
  properties:
    title:
      type: string
    summary:
      type: string
    root_cause_hypothesis:
      type: string
    findings:
      type: array
      items:
        type: string
    failed_nodes:
      type: array
      items:
        type: string
    related_files:
      type: array
      items:
        type: string
    evidence:
      type: array
      items:
        type: string
    recommended_actions:
      type: array
      items:
        type: string
    severity:
      type: string
      enum: [low, medium, high]
    confidence:
      type: string
      enum: [low, medium, high]
