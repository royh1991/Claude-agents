type: json_schema
name: failure_triage_report
schema:
  type: object
  additionalProperties: false
  required:
    - title
    - summary
    - root_cause_hypothesis
    - evidence
    - recommended_actions
    - severity
    - confidence
  properties:
    title:
      type: string
      minLength: 1
    summary:
      type: string
      minLength: 1
    root_cause_hypothesis:
      type: string
      minLength: 1
    evidence:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        required: [source, detail]
        properties:
          source:
            type: string
          detail:
            type: string
    recommended_actions:
      type: array
      minItems: 1
      items:
        type: string
    severity:
      type: string
      enum: [low, medium, high]
    confidence:
      type: string
      enum: [low, medium, high]
